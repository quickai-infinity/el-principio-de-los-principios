<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Genesis | Production Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .glass-panel { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); border: 1px solid #30363d; }
        .neon-text { text-shadow: 0 0 10px rgba(88, 166, 255, 0.5); }
    </style>
</head>
<body class="min-h-screen p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        <header class="mb-10 border-b border-gray-700 pb-4">
            <h1 class="text-4xl font-bold text-blue-400 neon-text tracking-widest uppercase">Prime Genesis</h1>
            <p class="text-gray-400 text-sm mt-1">v1.0 | Director: El Principio de los Principios</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Columna Izquierda: Controles -->
            <div class="glass-panel p-6 rounded-xl shadow-2xl">
                <h2 class="text-xl font-semibold mb-6 text-white border-b border-gray-700 pb-2">Panel de Control (API & n8n)</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">URL del Webhook (n8n)</label>
                        <input type="text" id="webhook_url" placeholder="https://tu-n8n.com/webhook/wan3-studio" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm focus:border-blue-500 outline-none text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Resolución (Wan 3.0)</label>
                        <select id="resolution" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-gray-200 outline-none">
                            <option value="720P">720P (Ideal IG/TikTok)</option>
                            <option value="1080P">1080P (Alta Calidad YouTube)</option>
                            <option value="480P">480P (Pruebas/Draft)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Alibaba Workspace ID</label>
                        <input type="text" id="workspace_id" placeholder="tu-workspace-id" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm focus:border-blue-500 outline-none text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Alibaba API Key</label>
                        <input type="password" id="api_key" placeholder="sk-..." class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm focus:border-blue-500 outline-none text-gray-200">
                    </div>
                </div>

                <h2 class="text-xl font-semibold mb-4 text-white border-b border-gray-700 pb-2">Narrativa y Dirección</h2>
                
                <div class="mb-4">
                    <label class="block text-xs text-gray-400 mb-1">Tu Visión Cruda (Inspiración - Sólo para ti)</label>
                    <textarea id="raw_idea" rows="3" placeholder="Escribe aquí lo que te llega a la mente... ej. Los humanos decidiendo a dónde ir en el domo..." class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-sm text-gray-300 focus:border-blue-500 outline-none resize-none"></textarea>
                </div>

                <div class="mb-6">
                    <label class="block text-xs text-blue-400 mb-1 font-bold">Prompt Hollywood (Enriquecido por la IA)</label>
                    <textarea id="prompt_final" rows="5" placeholder="Aquí pegas el prompt técnico con luces, sombras, texturas y el diálogo integrado para el lipsync de Wan 3.0..." class="w-full bg-gray-900 border border-blue-600 rounded p-3 text-sm text-white focus:border-blue-400 outline-none shadow-[0_0_10px_rgba(37,99,235,0.2)] resize-none"></textarea>
                </div>

                <button id="btn_generate" onclick="generarEscena()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded transition-all duration-300 transform hover:scale-[1.02] shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                    🎬 Renderizar Escena (Wan 3.0)
                </button>
                <p id="status_msg" class="text-center text-sm mt-3 text-yellow-400 hidden animate-pulse">Conectando con la Lattice... (Esto puede tomar varios minutos)</p>
            </div>

            <!-- Columna Derecha: Previsualización -->
            <div class="glass-panel p-6 rounded-xl shadow-2xl flex flex-col items-center justify-center min-h-[500px]">
                <h2 class="text-xl font-semibold w-full text-left mb-6 text-white border-b border-gray-700 pb-2">Monitor de Salida</h2>
                
                <div id="video_container" class="w-full aspect-video bg-black border border-gray-700 rounded-lg flex items-center justify-center overflow-hidden relative">
                    <span id="placeholder_text" class="text-gray-600 tracking-widest text-sm uppercase">Sin señal de renderizado</span>
                    <video id="result_video" class="w-full h-full object-cover hidden" controls autoplay loop></video>
                </div>

                <div class="w-full mt-6 flex justify-between items-center">
                    <span id="download_link_container" class="hidden">
                        <a id="download_btn" href="#" target="_blank" class="text-sm bg-gray-800 hover:bg-gray-700 border border-gray-600 px-4 py-2 rounded text-blue-400 font-semibold transition-colors">⬇️ Descargar MP4</a>
                    </span>
                    <span class="text-xs text-gray-500">Motor: Alibaba Cloud Wan 3.0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generarEscena() {
            const webhookUrl = document.getElementById('webhook_url').value;
            const workspaceId = document.getElementById('workspace_id').value;
            const apiKey = document.getElementById('api_key').value;
            const promptFinal = document.getElementById('prompt_final').value;
            const resolution = document.getElementById('resolution').value;
            
            const btn = document.getElementById('btn_generate');
            const statusMsg = document.getElementById('status_msg');
            const videoElement = document.getElementById('result_video');
            const placeholder = document.getElementById('placeholder_text');
            const downloadBtn = document.getElementById('download_btn');
            const downloadContainer = document.getElementById('download_link_container');

            if(!webhookUrl || !workspaceId || !apiKey || !promptFinal) {
                alert("Por favor, llena los campos de Webhook, Workspace, API Key y Prompt Final.");
                return;
            }

            // UI Changes: Cargando
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            statusMsg.classList.remove('hidden');
            videoElement.classList.add('hidden');
            placeholder.classList.remove('hidden');
            placeholder.innerText = "SINTETIZANDO EN LA 5TA DIMENSIÓN...";
            downloadContainer.classList.add('hidden');

            const payload = {
                workspace_id: workspaceId,
                api_key: apiKey,
                prompt: promptFinal,
                resolution: resolution
            };

            try {
                // Llamada a tu n8n
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if(data.success && data.video_url) {
                    // Éxito: Mostrar Video
                    videoElement.src = data.video_url;
                    videoElement.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    
                    downloadBtn.href = data.video_url;
                    downloadContainer.classList.remove('hidden');
                    statusMsg.innerText = "¡Renderizado Completado!";
                    statusMsg.classList.replace('text-yellow-400', 'text-green-400');
                    statusMsg.classList.remove('animate-pulse');
                } else {
                    throw new Error("Respuesta inválida del servidor");
                }
            } catch (error) {
                console.error("Error:", error);
                placeholder.innerText = "ERROR EN LA LATTICE";
                placeholder.classList.add('text-red-500');
                statusMsg.innerText = "Fallo de conexión. Revisa n8n o tu API Key.";
                statusMsg.classList.replace('text-yellow-400', 'text-red-500');
                statusMsg.classList.remove('animate-pulse');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                setTimeout(() => { 
                    statusMsg.classList.add('hidden');
                    statusMsg.innerText = "Conectando con la Lattice... (Esto puede tomar varios minutos)";
                    statusMsg.classList.replace('text-green-400', 'text-yellow-400');
                    statusMsg.classList.replace('text-red-500', 'text-yellow-400');
                    statusMsg.classList.add('animate-pulse');
                }, 5000);
            }
        }
    </script>
</body>
</html>
